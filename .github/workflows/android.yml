name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted
    #runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Install the Android SDK + required packages explicitly
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create google-services.json
        run: |
          mkdir -p app/src/google
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/src/google/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Specific flavor build
      - name: Build with Gradle
        run: ./gradlew :app:assembleGoogleDebug --stacktrace

      - name: Generate Lint report
        run: ./gradlew :app:lintGoogleDebug --stacktrace

      - name: Generate Dokka docs
        run: |
          ./gradlew dokkaGeneratePublicationHtml --stacktrace || ./gradlew dokkaGenerate --stacktrace

      - name: Generate Kover coverage report
        run: |
          ./gradlew testGoogleDebugUnitTest --stacktrace
          ./gradlew koverHtmlReport --stacktrace || ./gradlew :app:koverHtmlReportGoogleDebug --stacktrace

      - name: Prepare static reports folder
        run: |
          set -e

          rm -rf _site
          mkdir -p _site/lint
          mkdir -p _site/dokka
          mkdir -p _site/coverage

          echo "=== Searching Lint report ==="
          LINT_INDEX=$(find . \
            \( -name "lint-results-googleDebug.html" -o -name "lint-results-debug.html" -o -name "lint-results*.html" \) \
            | head -n 1)

          if [ -n "$LINT_INDEX" ] && [ -f "$LINT_INDEX" ]; then
            echo "Lint report found at: $LINT_INDEX"
            cp "$LINT_INDEX" _site/lint/index.html
          else
            echo "ERROR: Lint report not found"
            find . -path "*/build/reports/*" -type f | sort
            exit 1
          fi

          echo "=== Searching Dokka index.html ==="
          DOKKA_INDEX=$(find . \
            -path "*/build/dokka*" \
            -name "index.html" \
            | head -n 1)

          if [ -n "$DOKKA_INDEX" ] && [ -f "$DOKKA_INDEX" ]; then
            DOKKA_DIR=$(dirname "$DOKKA_INDEX")
            echo "Dokka docs found at: $DOKKA_DIR"
            cp -a "$DOKKA_DIR"/. _site/dokka/
          else
            echo "ERROR: Dokka index.html not found"
            find . -path "*/build/dokka*" -type f | sort || true
            exit 1
          fi

          echo "=== Searching Kover index.html ==="
          KOVER_INDEX=$(find . \
            -path "*/build/reports/kover/*" \
            -name "index.html" \
            | head -n 1)

          if [ -n "$KOVER_INDEX" ] && [ -f "$KOVER_INDEX" ]; then
            KOVER_DIR=$(dirname "$KOVER_INDEX")
            echo "Kover report found at: $KOVER_DIR"
            cp -a "$KOVER_DIR"/. _site/coverage/
          else
            echo "ERROR: Kover index.html not found"
            find . -path "*/build/reports/kover*" -type f | sort || true
            exit 1
          fi

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>PuntroSales Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              a { display: block; margin: 12px 0; font-size: 18px; }
            </style>
          </head>
          <body>
            <h1>PuntroSales CI Reports</h1>
            <a href="./lint/">Android Lint Report</a>
            <a href="./dokka/">Dokka Documentation</a>
            <a href="./coverage/">Kover Coverage Report</a>
          </body>
          </html>
          EOF

          echo "=== Final _site content ==="
          find _site -maxdepth 3 -type f | sort

      - name: Deploy reports to Nginx server
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $DEPLOY_PATH"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=no" \
            _site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"