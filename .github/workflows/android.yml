name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted
    #runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Install the Android SDK + required packages explicitly
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create google-services.json
        run: |
          mkdir -p app/src/google
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/src/google/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Specific flavor build
      - name: Build with Gradle
        run: ./gradlew :app:assembleGoogleDebug --stacktrace

      - name: Generate Lint reports by module
        run: |
          ./gradlew \
            :app:lintGoogleDebug \
            :app:lintHuaweiDebug \
            :demosales-data:clients:lintDebug \
            :demosales-data:products:lintDebug \
            :demosales-data:sales:lintDebug \
            :demosales-ui:clients:lintDebug \
            :demosales-ui:products:lintDebug \
            :demosales-ui:sales:lintDebug \
            :demosales-ui:theme:lintDebug \
            --stacktrace

      - name: Generate Dokka multi-module docs
        run: ./gradlew :dokkaGeneratePublicationHtml --stacktrace

      - name: Generate Kover coverage report
        run: ./gradlew :app:testGoogleDebugUnitTest :app:koverHtmlReportGoogleDebug --stacktrace

      - name: Prepare static reports folder
        run: |
          set -e

          rm -rf _site
          mkdir -p _site/lint
          mkdir -p _site/dokka
          mkdir -p _site/coverage

          cat > _site/lint/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PuntroSales Lint Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.5; }
              li { margin: 10px 0; }
            </style>
          </head>
          <body>
            <h1>Android Lint Reports by Module</h1>
            <ul>
              <li><a href="./app-google-debug/">app — Google Debug</a></li>
              <li><a href="./app-huawei-debug/">app — Huawei Debug</a></li>
              <li><a href="./demosales-data-clients/">demosales-data-clients</a></li>
              <li><a href="./demosales-data-products/">demosales-data-products</a></li>
              <li><a href="./demosales-data-sales/">demosales-data-sales</a></li>
              <li><a href="./demosales-ui-clients/">demosales-ui-clients</a></li>
              <li><a href="./demosales-ui-products/">demosales-ui-products</a></li>
              <li><a href="./demosales-ui-sales/">demosales-ui-sales</a></li>
              <li><a href="./demosales-ui-theme/">demosales-ui-theme</a></li>
            </ul>
          </body>
          </html>
          EOF

          copy_lint_report() {
            target="$1"
            source="$2"
            if [ ! -f "$source" ]; then
              echo "ERROR: Expected Lint report not found: $source"
              exit 1
            fi
            mkdir -p "_site/lint/$target"
            cp "$source" "_site/lint/$target/index.html"
          }

          copy_lint_report "app-google-debug" "app/build/reports/lint-results-googleDebug.html"
          copy_lint_report "app-huawei-debug" "app/build/reports/lint-results-huaweiDebug.html"
          copy_lint_report "demosales-data-clients" "demosales-data/clients/build/reports/lint-results-debug.html"
          copy_lint_report "demosales-data-products" "demosales-data/products/build/reports/lint-results-debug.html"
          copy_lint_report "demosales-data-sales" "demosales-data/sales/build/reports/lint-results-debug.html"
          copy_lint_report "demosales-ui-clients" "demosales-ui/clients/build/reports/lint-results-debug.html"
          copy_lint_report "demosales-ui-products" "demosales-ui/products/build/reports/lint-results-debug.html"
          copy_lint_report "demosales-ui-sales" "demosales-ui/sales/build/reports/lint-results-debug.html"
          copy_lint_report "demosales-ui-theme" "demosales-ui/theme/build/reports/lint-results-debug.html"

          echo "=== Copying Dokka multi-module documentation ==="
          DOKKA_DIR="build/dokka/html"
          if [ ! -f "$DOKKA_DIR/index.html" ]; then
            echo "ERROR: Dokka multi-module index not found at $DOKKA_DIR/index.html"
            find . -path "*/build/dokka*" -type f | sort || true
            exit 1
          fi
          cp -a "$DOKKA_DIR"/. _site/dokka/

          echo "=== Copying Kover report ==="
          KOVER_DIR="app/build/reports/kover/htmlGoogleDebug"
          if [ ! -f "$KOVER_DIR/index.html" ]; then
            echo "ERROR: Kover report not found at $KOVER_DIR/index.html"
            exit 1
          fi
          cp -a "$KOVER_DIR"/. _site/coverage/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>PuntroSales Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              a { display: block; margin: 12px 0; font-size: 18px; }
            </style>
          </head>
          <body>
            <h1>PuntroSales CI Reports</h1>
            <a href="./lint/">Android Lint Reports by Module</a>
            <a href="./dokka/">Dokka Multi-module Documentation</a>
            <a href="./coverage/">Kover Coverage Report</a>
          </body>
          </html>
          EOF

          echo "=== Final _site content ==="
          find _site -maxdepth 3 -type f | sort

      - name: Deploy reports to Nginx server
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $DEPLOY_PATH"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=no" \
            _site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
