name: Google Play Internal Release
run-name: Google Play internal - ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Google Play edits for this app must finish before another release starts.
concurrency:
  group: google-play-com-imecatro-demosales
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Validate release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH, for example v1.15.4.")

          source = Path("app/build.gradle.kts").read_text()
          name = re.search(r'^\s*versionName\s*=\s*"([^\"]+)"', source, re.MULTILINE)
          code = re.search(r'^\s*versionCode\s*=\s*(\d+)\s*$', source, re.MULTILINE)
          if not name or not code or int(code.group(1)) < 1:
              raise SystemExit("Set versionName and a positive versionCode in app/build.gradle.kts.")
          if tag != f"v{name.group(1)}":
              raise SystemExit(f"Tag {tag} does not match versionName {name.group(1)}.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version_code={code.group(1)}\n")
          print(f"Building {tag}, versionCode {code.group(1)}.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Prepare release credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
            GOOGLE_SERVICES_JSON_BASE64 PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing GitHub secret: $secret_name"
              exit 1
            fi
          done

          umask 077
          mkdir -p app/src/google

          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          from pathlib import Path

          def decode_secret(name):
              try:
                  return base64.b64decode("".join(os.environ[name].split()), validate=True)
              except (binascii.Error, ValueError):
                  raise SystemExit(f"{name} must contain valid Base64.") from None

          keystore = decode_secret("ANDROID_KEYSTORE_BASE64")
          if not keystore:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 must contain a keystore.")
          google_config = decode_secret("GOOGLE_SERVICES_JSON_BASE64")
          config = json.loads(google_config)
          packages = [client.get("client_info", {}).get("android_client_info", {}).get("package_name")
                      for client in config.get("client", [])]
          if "com.imecatro.demosales" not in packages:
              raise SystemExit("GOOGLE_SERVICES_JSON_BASE64 must contain the Google flavor configuration.")
          account = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          if account.get("type") != "service_account" or not account.get("client_email") or not account.get("private_key"):
              raise SystemExit("PLAY_SERVICE_ACCOUNT_JSON must contain a service account JSON key.")

          temp = Path(os.environ["RUNNER_TEMP"])
          (temp / "puntrosales-upload.jks").write_bytes(keystore)
          (temp / "puntrosales-play.json").write_text(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          Path("app/src/google/google-services.json").write_bytes(google_config)
          PY

      - name: Build signed Google release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/puntrosales-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: bash ./gradlew :app:bundleGoogleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Save AAB and mapping file
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: google-play-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/googleRelease/*.aab
            app/build/outputs/mapping/googleRelease/mapping.txt
          if-no-files-found: error

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1, Node.js 24
        with:
          serviceAccountJson: ${{ runner.temp }}/puntrosales-play.json
          packageName: com.imecatro.demosales
          releaseFiles: app/build/outputs/bundle/googleRelease/*.aab
          mappingFile: app/build/outputs/mapping/googleRelease/mapping.txt
          releaseName: ${{ github.ref_name }}
          tracks: internal
          status: completed

      - name: Write release summary
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "### Google Play internal testing"
            echo "- Version: $GITHUB_REF_NAME (versionCode $VERSION_CODE)"
            echo "- Package: com.imecatro.demosales"
            echo "- [Download AAB and mapping file]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/puntrosales-upload.jks" "$RUNNER_TEMP/puntrosales-play.json" app/src/google/google-services.json
